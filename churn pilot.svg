<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <!-- Gradients & Definitions -->
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" /> <!-- Tailwind Indigo 600 -->
      <stop offset="100%" stop-color="#312e81" /> <!-- Tailwind Indigo 900 -->
    </linearGradient>
    <linearGradient id="profitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" /> <!-- Tailwind Emerald 400 -->
      <stop offset="100%" stop-color="#059669" /> <!-- Tailwind Emerald 600 -->
    </linearGradient>
  </defs>

  <!-- Logo Icon: Credit Card & Pilot Wing -->
  <g transform="translate(15, 20)">
    <!-- Credit Card Base -->
    <rect x="10" y="25" width="60" height="42" rx="6" fill="none" stroke="url(#indigoGrad)" stroke-width="4" />
    
    <!-- Magnetic Stripe / Chip abstraction -->
    <line x1="10" y1="36" x2="70" y2="36" stroke="url(#indigoGrad)" stroke-width="4" />
    <rect x="20" y="46" width="12" height="8" rx="2" fill="#cbd5e1" />

    <!-- "Pilot" / Flight Element Soaring (Paper Airplane / Delta Wing) -->
    <path d="M 40,62 L 85,15 L 68,70 L 58,54 Z" fill="url(#profitGrad)" />
    
    <!-- Motion/Scan lines behind the plane -->
    <path d="M 30,55 L 45,40" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <path d="M 45,72 L 55,62" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Typography -->
  <text x="120" y="70" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" letter-spacing="-0.5">
    <tspan font-weight="800" fill="#1e293b">Churn</tspan><tspan font-weight="300" fill="#475569">Pilot</tspan>
  </text>

  <!-- App Version/Description Subtitle -->
  <text x="123" y="94" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="700" letter-spacing="4">
    OFFER SCANNER
  </text>
</svg>
