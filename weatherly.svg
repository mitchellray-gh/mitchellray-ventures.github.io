<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Multi-stop Risk & Radar Gradient (Minimal -> Extreme) -->
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" /> <!-- Tailwind Sky -->
      <stop offset="35%" stop-color="#6366f1" /> <!-- Tailwind Indigo -->
      <stop offset="65%" stop-color="#d946ef" /> <!-- Tailwind Fuchsia -->
      <stop offset="100%" stop-color="#f43f5e" /> <!-- Tailwind Rose -->
    </linearGradient>
  </defs>

  <!-- Isometric Base Grid (Represents Topography / Map Layers) -->
  <g stroke="#94a3b8" stroke-width="1" opacity="0.6">
    <!-- Colored quadrant floors (representing Radar overlays) -->
    <path d="M 65 47.5 L 92.5 61.25 L 65 75 L 37.5 61.25 Z" fill="#94a3b8" opacity="0.05" stroke="none" />
    <path d="M 92.5 61.25 L 120 75 L 92.5 88.75 L 65 75 Z" fill="#d946ef" opacity="0.1" stroke="none" />
    <path d="M 65 75 L 92.5 88.75 L 65 102.5 L 37.5 88.75 Z" fill="#f43f5e" opacity="0.1" stroke="none" />
    <path d="M 37.5 61.25 L 65 75 L 37.5 88.75 L 10 75 Z" fill="#0ea5e9" opacity="0.1" stroke="none" />

    <!-- Isometric Grid Lines -->
    <path d="M 10 75 L 65 102.5 L 120 75 L 65 47.5 Z" fill="none" stroke-width="1.5" />
    <line x1="37.5" y1="61.25" x2="92.5" y2="88.75" />
    <line x1="37.5" y1="88.75" x2="92.5" y2="61.25" />
  </g>

  <!-- Drop Lines & Map Targets (Represents Intelligence/Tracking) -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 3">
    <!-- Left Target -->
    <ellipse cx="45" cy="85" rx="6" ry="3" fill="none" />
    <line x1="45" y1="65" x2="45" y2="85" />
    <!-- Center Target -->
    <ellipse cx="65" cy="55" rx="8" ry="4" fill="none" />
    <line x1="65" y1="30" x2="65" y2="55" />
    <!-- Right Target -->
    <ellipse cx="85" cy="85" rx="6" ry="3" fill="none" />
    <line x1="85" y1="65" x2="85" y2="85" />
  </g>

  <!-- The "W" Intelligence Ribbon (Data Trends / Weatherly Brand) -->
  <path d="M 20 40 L 45 65 L 65 30 L 85 65 L 110 40"
        fill="none" stroke="url(#wGrad)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round" />

  <!-- Risk / Disaster Nodes -->
  <g>
    <!-- Left Node (Minimal Risk) -->
    <circle cx="45" cy="65" r="9" fill="#0ea5e9" opacity="0.25" />
    <circle cx="45" cy="65" r="4" fill="#0ea5e9" />
    <!-- Center Node (Active Alert) -->
    <circle cx="65" cy="30" r="12" fill="#a855f7" opacity="0.25" />
    <circle cx="65" cy="30" r="5" fill="#a855f7" />
    <circle cx="65" cy="30" r="2" fill="#ffffff" />
    <!-- Right Node (Extreme Risk) -->
    <circle cx="85" cy="65" r="9" fill="#f43f5e" opacity="0.25" />
    <circle cx="85" cy="65" r="4" fill="#f43f5e" />
  </g>

  <!-- Typography -->
  <!-- Switched to a highly structured, tracked-out aesthetic -->
  <text x="145" y="65" font-family="'Plus Jakarta Sans', 'Space Grotesk', -apple-system, sans-serif" font-size="38" fill="#0f172a" font-weight="800" letter-spacing="2">
    WEATHERLY
  </text>

  <!-- Subtitle -->
  <text x="148" y="88" font-family="'Inter', -apple-system, sans-serif" font-size="11" fill="#64748b" font-weight="700" letter-spacing="4">
    ENVIRONMENTAL INTELLIGENCE
  </text>
</svg>
