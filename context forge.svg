<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <!-- Gradients & Definitions -->
  <defs>
    <!-- Hot Forge Gradient (The "Forge" & LLM Engine) -->
    <linearGradient id="forgeFire" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" /> <!-- Tailwind Rose 600 -->
      <stop offset="50%" stop-color="#f97316" /> <!-- Tailwind Orange 500 -->
      <stop offset="100%" stop-color="#facc15" /> <!-- Tailwind Yellow 400 -->
    </linearGradient>
    
    <!-- Cool Input Gradient (The Raw Data) -->
    <linearGradient id="dataCool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" /> <!-- Tailwind Indigo 500 -->
      <stop offset="100%" stop-color="#a855f7" /> <!-- Tailwind Purple 500 -->
    </linearGradient>
  </defs>

  <!-- Logo Icon: Data Ingestion & The AI Forge Spark -->
  <g transform="translate(15, 20)">
    <!-- Raw / Messy Data Input entering the forge -->
    <path d="M 10 25 L 25 15 L 35 25" fill="none" stroke="url(#dataCool)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
    <path d="M 5 40 L 20 30 L 30 40" fill="none" stroke="url(#dataCool)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />

    <!-- The Forge Spark / AI Core -->
    <path d="M 40,10 Q 40,40 70,40 Q 40,40 40,70 Q 40,40 10,40 Q 40,40 40,10 Z" fill="url(#forgeFire)" />
    <!-- Inner bright core -->
    <path d="M 40,25 Q 40,40 55,40 Q 40,40 40,55 Q 40,40 25,40 Q 40,40 40,25 Z" fill="#ffffff" opacity="0.8" />

    <!-- Clean Markdown Output / Optimized Context Packs -->
    <rect x="55" y="45" width="25" height="4" rx="2" fill="#f97316" />
    <rect x="55" y="55" width="16" height="4" rx="2" fill="#e11d48" />
  </g>

  <!-- Typography -->
  <text x="115" y="70" font-family="'Playfair Display', 'Merriweather', 'Georgia', serif" font-size="44" fill="#09090b" letter-spacing="-1">
    <tspan font-weight="800">Context</tspan><tspan font-weight="400" font-style="italic">Forge</tspan>
  </text>

  <!-- App Subtitle -->
  <text x="118" y="94" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#71717a" font-weight="700" letter-spacing="3">
    CONTEXT OPTIMIZATION ENGINE
  </text>
</svg>
